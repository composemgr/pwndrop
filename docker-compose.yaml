# nginx proxy address - http://172.17.0.1:8110

name: pwndrop
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  pwndrop:
    image: ghcr.io/nikitastupin/pwndrop:latest
    pull_policy: always
    container_name: pwndrop-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    logging: *default-logging
    networks:
      - pwndrop
    ports:
      - "172.17.0.1:8110:8080"
    environment:
      TZ: ${TZ:-America/New_York}
      PWNDROP_SECRET: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      PWNDROP_ADMIN_USER: ${APP_ADMIN_USER:-admin}
      PWNDROP_ADMIN_PASS: ${APP_ADMIN_PASS:-changeme_admin_password}
    volumes:
      - ./volumes/config/pwndrop:/config
      - ./volumes/data/pwndrop:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  pwndrop:
    name: pwndrop
    external: false
